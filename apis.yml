name: Invidica
description: Invidica is an Oakland-based B2B wholesale ecommerce marketplace (founded 2019) that upgrades
  the wholesaler-retailer relationship for the reseller economy. It pairs a marketplace where resellers order
  wholesale products directly from brands with AI-driven analytics that combine Amazon sales data to predict
  an item's profitability, sales velocity, and competition, helping small sellers find the most profitable
  products to resell. Founded by CEO Sean Bovell and backed by 500 Global and 1517 Fund (pre-seed, 2021). The
  company appears to be pivoting under the Reroute Retail brand (rerouteretail.com, "launching soon"); its
  original invidica.com domain no longer resolves. No public API or developer surface is currently published.
